name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check checked-out source consistency
        env:
          GLIBC_TUNABLES: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
        shell: /usr/bin/env -S -i PATH=/usr/bin:/bin HOME=/tmp LC_ALL=C /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          digest=$(sha256sum SOURCE_MANIFEST.sha256 | awk '{ print $1 }')
          scripts/run-authoritative-gate.sh git "$digest" \
            '${{ github.sha }}' verify-source-tree
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - name: Install native test tools
        run: sudo apt-get update && sudo apt-get install -y libssl-dev valgrind
      - name: Expose resolved Rust binaries to hermetic gates
        run: |
          for tool in cargo rustc rustfmt cargo-fmt cargo-clippy rustdoc; do
            sudo ln -sf "$(rustup which "$tool")" "/usr/bin/$tool"
          done
      - name: Run core and hostile regressions
        env:
          GLIBC_TUNABLES: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
        shell: /usr/bin/env -S -i PATH=/usr/bin:/bin HOME=/tmp LC_ALL=C /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          expected_commit='${{ github.sha }}'
          digest=$(sha256sum SOURCE_MANIFEST.sha256 | awk '{ print $1 }')
          scripts/run-authoritative-gate.sh git "$digest" \
            "$expected_commit" verify-source-tree
          snapshot=$(mktemp -d)
          trap 'chmod -R u+w "$snapshot"; rm -rf "$snapshot"' EXIT
          {
            printf '%s\n' SOURCE_MANIFEST.sha256
            awk '{ print substr($0, 67) }' SOURCE_MANIFEST.sha256
          } | tar -cf - -T - | tar -xf - -C "$snapshot"
          test "$(sha256sum "$snapshot/SOURCE_MANIFEST.sha256" | awk '{ print $1 }')" = "$digest"
          chmod -R a-w "$snapshot"
          "$snapshot/scripts/run-authoritative-gate.sh" archive \
            "$digest" check
          "$snapshot/scripts/run-authoritative-gate.sh" archive \
            "$digest" review-tests

  provider:
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 3.5.8
            sha256: a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2
          - version: 4.0.2
            sha256: 736b467530f916737b7031310ccb21d8218c6229e61e8e160cd1d3458cd543a8
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check checked-out source consistency
        env:
          GLIBC_TUNABLES: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
        shell: /usr/bin/env -S -i PATH=/usr/bin:/bin HOME=/tmp LC_ALL=C /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          digest=$(sha256sum SOURCE_MANIFEST.sha256 | awk '{ print $1 }')
          scripts/run-authoritative-gate.sh git "$digest" \
            '${{ github.sha }}' verify-source-tree
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Install provider test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tools gawk jq libclang-rt-dev libssl-dev valgrind
      - name: Expose resolved Rust binaries to hermetic gates
        run: |
          for tool in cargo rustc rustfmt cargo-fmt cargo-clippy rustdoc; do
            sudo ln -sf "$(rustup which "$tool")" "/usr/bin/$tool"
          done
      - name: Build and verify OpenSSL lane
        env:
          GLIBC_TUNABLES: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
        shell: /usr/bin/env -S -i PATH=/usr/bin:/bin HOME=/tmp LC_ALL=C /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          expected_commit='${{ github.sha }}'
          version='${{ matrix.version }}'
          tarball_sha256='${{ matrix.sha256 }}'
          digest=$(sha256sum SOURCE_MANIFEST.sha256 | awk '{ print $1 }')
          scripts/run-authoritative-gate.sh git "$digest" \
            "$expected_commit" verify-source-tree
          snapshot=$(mktemp -d)
          work=$(mktemp -d)
          trap 'chmod -R u+w "$snapshot" "$work"; rm -rf "$snapshot" "$work"' EXIT
          {
            printf '%s\n' SOURCE_MANIFEST.sha256
            awk '{ print substr($0, 67) }' SOURCE_MANIFEST.sha256
          } | tar -cf - -T - | tar -xf - -C "$snapshot"
          test "$(sha256sum "$snapshot/SOURCE_MANIFEST.sha256" | awk '{ print $1 }')" = "$digest"
          chmod -R a-w "$snapshot"
          mkdir "$work/upstream"
          curl -fL --retry 3 --proto '=https' --proto-redir '=https' \
            "https://www.openssl.org/source/openssl-$version.tar.gz" \
            -o "$work/upstream/openssl-$version.tar.gz"
          printf '%s  %s\n' "$tarball_sha256" "openssl-$version.tar.gz" \
            >"$work/upstream/openssl-$version.tar.gz.sha256"
          "$snapshot/scripts/run-authoritative-gate.sh" archive "$digest" \
            build-openssl-provider-lane \
            "$version" "$work/upstream" "$work/lane"
          lane_digest=$(sha256sum \
            "$work/lane/logs/$version/evidence_manifest.sha256" \
            | awk '{ print $1 }')
          "$snapshot/scripts/run-authoritative-gate.sh" archive "$digest" \
            test-provider "$work/lane" "$version" "$lane_digest"

  rpm-contract:
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Fedora packaging contract
        run: |
          dnf -qy install binutils cargo cargo-rpm-macros curl gcc git \
            openssl openssl-devel python3 rpm-build rust rustfmt ShellCheck
          shellcheck scripts/check-rpm-packaging.sh scripts/test-rpm-install.sh
          scripts/check-rpm-packaging.sh
          topdir=$(mktemp -d)
          mkdir -p "$topdir/SOURCES"
          commit=$(awk '$1 == "%global" && $2 == "commit" { print $3 }' \
            packaging/rpm/ed301-openssl-provider.spec)
          curl -fL --retry 3 --proto '=https' --proto-redir '=https' \
            "https://github.com/ychromosome/ed301-eddsa/archive/$commit/ed301-eddsa-$commit.tar.gz" \
            -o "$topdir/SOURCES/ed301-eddsa-$commit.tar.gz"
          cp packaging/rpm/0001-Allow-standard-RPM-native-build-flags.patch \
            packaging/rpm/ed301-provider.conf "$topdir/SOURCES/"
          rpmbuild -ba --define "_topdir $topdir" \
            packaging/rpm/ed301-openssl-provider.spec
          scripts/test-rpm-install.sh "$topdir/RPMS/x86_64"
