[package]
name = "ed301-eddsa-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Experimental signature-only OpenSSL provider for Ed301-EdDSA-draft-00 (test-only, nonregistrable identifiers)"

[lib]
name = "ed301_eddsa_draft00"
crate-type = ["cdylib"]
path = "src/lib.rs"

# The ordinary module is built with the default (empty) feature set.  Every
# diagnostic or private-use TLS surface is compiled into a separately named
# test artifact, never into the ordinary provider.
[features]
default = []
test-failpoint = []
tls-experiment = []
tls-collider = []
secret-taint-instrumentation = ["ed301-eddsa/secret-taint-instrumentation"]

[dependencies]
crypto-bigint = { version = "=0.7.5", default-features = false }
ed301-eddsa = { path = "../../../crates/ed301-eddsa" }
zeroize = { version = "=1.9.0", default-features = false }

[build-dependencies]
cc = { version = "=1.2.66", default-features = false }
