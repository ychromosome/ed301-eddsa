[workspace]
members = ["crates/ed301-eddsa"]
exclude = [
    "integration/downstream-workspace",
    "provider",
    "secret-taint",
    "secret-taint/valgrind-client",
    "vendor/crypto-bigint",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
overflow-checks = true
